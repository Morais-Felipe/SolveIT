# Testes de ponta a ponta (plano 07-02): o runner sobe o docker compose completo
# (API, web/nginx, MySQL e Mailpit) e o Playwright percorre as jornadas dos três
# perfis em desktop e celular. Roda em todo PR, porque uma mudança só no back-end
# ou só no front-end pode quebrar a jornada.
name: E2E

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Jornadas E2E (Playwright + docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: solveit-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: solveit-web/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Jornadas
        run: npm run e2e

      - name: Publicar relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            solveit-web/playwright-report/
            solveit-web/test-results/
          retention-days: 7
