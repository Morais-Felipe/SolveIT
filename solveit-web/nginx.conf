# Uma única origem para o navegador: páginas e /api saem do mesmo endereço, como no
# proxy do Vite em desenvolvimento. Assim não há CORS a configurar.
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # "api" é o nome do serviço no docker-compose; a rede interna resolve esse nome.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos com hash no nome (gerados pelo Vite) podem ficar em cache por muito tempo.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: rotas como /chamados/7 não existem em disco; o index.html carrega o React,
    # que decide a tela. Sem isso, recarregar a página daria 404 do nginx.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
