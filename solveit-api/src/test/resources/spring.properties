# Cada classe de teste tem o próprio MySQL, então um contexto nunca é reaproveitado por outra classe.
# Com o limite padrão (32), todos ficavam abertos até o fim da JVM, com pools tentando reconectar a
# containers já encerrados, e esse ruído caía nos testes que verificam o log do processo.
# Com limite 1, o Spring fecha o contexto anterior ao guardar o da próxima classe.
spring.test.context.cache.maxSize=1
